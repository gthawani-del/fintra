<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:Lyric;src:url(assets/fonts/sans.woff2);font-weight:500}
@font-face{font-family:Lyric;src:url(assets/fonts/sans-bold.woff2);font-weight:700}
@font-face{font-family:Lyric;src:url(assets/fonts/sans-heavy.woff2);font-weight:800}
html,body{margin:0;background:#191820;overflow:hidden;width:100%;height:100%}canvas{display:block;width:100%;height:100%}
</style></head><body><canvas id="film"></canvas><script>
'use strict';
const query=new URLSearchParams(location.search),OFFSET=Number(query.get('start')||0);
window.DUR=Math.min(Number(query.get('duration')||133.24),133.24-OFFSET);window.READY=false;
const canvas=document.getElementById('film'),c=canvas.getContext('2d',{alpha:false});
let W=1080,H=1920,shots=[],cues=[],photos={};const cache=new Map(),CREAM='#fff4df';
const clamp=x=>Math.max(0,Math.min(1,x)),smooth=x=>{x=clamp(x);return x*x*(3-2*x)},out=x=>1-(1-clamp(x))**3;
async function image(src){if(cache.has(src))return cache.get(src);const im=new Image();im.src=src;await im.decode();cache.set(src,im);if(cache.size>12)cache.delete(cache.keys().next().value);return im}
async function frame(s,t){if(!s.moving)return photos[s.source];const local=Math.max(0,Math.min(s.source==='shore-motion'?4.9583:7.9583,s.sourceIn+t-s.in));const n=Math.floor(local*24+1e-5);const base=s.source==='shore-motion'?'assets/frames/':'media/'+s.source+'/';return image(base+String(n).padStart(4,'0')+'.jpg')}
function cover(im,z,x=.5,y=.5){const scale=Math.max(W/im.naturalWidth,H/im.naturalHeight)*z,sw=im.naturalWidth*scale,sh=im.naturalHeight*scale;c.drawImage(im,-(sw-W)*x,-(sh-H)*y,sw,sh)}
function shot(s,im,t){const p=smooth((t-s.in)/(s.out-s.in)),z=s.zoomStart+(s.zoomEnd-s.zoomStart)*p;c.save();if(s.grade==='present')c.filter='saturate(.74) brightness(.96)';else if(s.source.startsWith('B'))c.filter='saturate(1.05)';cover(im,z,s.focusX,s.focusY);c.restore();if(s.source.startsWith('B')){c.fillStyle='rgba(137,60,21,.035)';c.fillRect(0,0,W,H)}}
function shade(strength){const g=c.createLinearGradient(0,0,0,H*.42);g.addColorStop(0,`rgba(18,19,26,${strength})`);g.addColorStop(.65,`rgba(18,19,26,${strength*.63})`);g.addColorStop(1,'rgba(18,19,26,0)');c.fillStyle=g;c.fillRect(0,0,W,H*.43)}
// Exact source wording remains the registry. Two type roles establish the lyric hierarchy.
const accents={
 'line-01':'Mmm...', 'line-02':'moves on', 'line-03':'stay',
 'line-04':'clock on the wall', 'line-05':'an empty hall', 'line-06':'restless mind',
 'line-07':'left behind', 'line-08':'watch it bend', 'line-09':'where it ends',
 'line-10':'vaade raaste', 'line-11':'har mod pe', 'line-12':'woh sama tha', 'line-13':'ek jahaan tha',
 'line-14':'lamhe', 'line-15':'baatein', 'line-16':'na jaane', 'line-17':'inside',
 'line-18':'raatein', 'line-19':'Barsatein', 'line-20':'the end', 'line-21':'fade to grey',
 'line-22':'kabhi na jayenge', 'line-23':'down outside', 'line-24':'nowhere left to hide',
 'line-25':'swept into the dust', 'line-26':'nothing left to trust', 'line-27':'dard ye uthta hai',
 'line-28':'the walls right in', 'line-29':'naam tera rukta hai', 'line-30':'the fractures begin',
 'line-31':'lamhe', 'line-32':'away', 'line-33':'raatein', 'line-34':'the rain'
};
function rows(text,fs,weight,maxW){c.font=`${weight} ${fs}px Lyric`;c.letterSpacing='0px';let line='',lines=[];for(const word of text.split(' ').filter(Boolean)){const next=line?line+' '+word:word;if(line&&c.measureText(next).width>maxW){lines.push(line);line=word}else line=next}if(line)lines.push(line);return lines}
function typePlan(q){
 const hero=q.section==='chorus',accent=accents[q.id],body=q.text.slice(0,q.text.length-accent.length).trim();
 if(!q.text.endsWith(accent))throw Error('Lyric registry mismatch '+q.id);
 const num=Number(q.id.slice(-2)),align=hero?'center':([5,6,11,13,23,26,28,30].includes(num)?'right':'left');
 const maxW=W*.82,bodySize=W*(hero?.055:.061),bodyRows=rows(body,bodySize,500,maxW);
 let big=W*(hero?.165:.092);while(rows(accent,big,800,maxW).length>1)big*=.96;
 const result=bodyRows.map(text=>({text,size:bodySize,weight:500,accent:false}));result.push({text:accent,size:big,weight:800,accent:true});
 let baseline=H*(hero?.135:.12);for(const row of result){baseline+=row.size*(row.accent?1.12:1.18);row.y=baseline}
 return {rows:result,align,hero,num};
}
function spacedText(text,x,y,spacing,align){const widths=[...text].map(ch=>c.measureText(ch).width),total=widths.reduce((a,b)=>a+b,0)+Math.max(0,widths.length-1)*spacing;let xx=x-(align==='center'?total/2:align==='right'?total:0);c.textAlign='left';[...text].forEach((ch,i)=>{c.fillText(ch,xx,y);xx+=widths[i]+spacing})}
function drawText(q,t){
 const plan=typePlan(q),age=t-q.start,remain=q.end-t,leave=smooth(remain/.13),x=W*(plan.align==='center'?.5:plan.align==='right'?.91:.09);
 for(let i=0;i<plan.rows.length;i++){
  const r=plan.rows[i],delay=r.accent?.055:0,e=out((age-delay)/(plan.hero?.38:.29));
  c.save();c.font=`${r.weight} ${r.size}px Lyric`;c.textBaseline='alphabetic';c.letterSpacing='0px';
  c.globalAlpha=smooth((age-delay)/.10)*leave;c.fillStyle=r.accent?'#fff5e7':'#eee8dd';
  const slide=(1-e)*W*(plan.hero?0:plan.align==='right'?.035:-.035);
  c.translate(x+slide,r.y+(1-e)*(plan.hero?H*.018:0)-(1-leave)*H*.004);
  if(r.accent&&plan.hero){const z=.88+.12*e;c.scale(z,z);spacedText(r.text,0,0,(1-e)*W*.003,plan.align)}
  else{c.textAlign=plan.align;c.fillText(r.text,0,0)}
  c.restore();
 }
}
function title(t){if(t<.35||t>4.65)return;const age=t-.35,e=out(age/.8),leave=smooth((4.65-t)/.4);c.save();c.textAlign='left';c.textBaseline='alphabetic';c.fillStyle=CREAM;c.globalAlpha=smooth(age/.2)*leave;c.font=`500 ${W*.065}px Lyric`;c.fillText('Woh',W*.09,H*.16);c.font=`800 ${W*.17}px Lyric`;c.fillText('Lamhe',W*.09-(1-e)*W*.04,H*.265);c.restore()}
window.render=async function(localT){const t=Math.min(133.239,Math.max(0,localT+OFFSET));if(canvas.width!==innerWidth||canvas.height!==innerHeight){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
 const i=shots.findIndex(s=>t>=s.in&&t<s.out);if(i<0)throw Error('Timeline gap at '+t);const s=shots[i],im=await frame(s,t);c.globalAlpha=1;c.filter='none';
 if(i>0&&s.transition==='dissolve'&&t-s.in<.35){const prev=shots[i-1],old=await frame(prev,prev.out-.042);shot(prev,old,prev.out-.042);c.save();c.globalAlpha=smooth((t-s.in)/.35);shot(s,im,t);c.restore()}else shot(s,im,t);
 const q=cues.find(q=>t>=q.start&&t<q.end);shade(q?.52:.16);title(t);if(q)drawText(q,t);
 if(t>131.7){c.fillStyle=`rgba(18,18,23,${smooth((t-131.7)/1.54)})`;c.fillRect(0,0,W,H)}
};
(async()=>{await Promise.all([500,700,800].map(w=>document.fonts.load(`${w} 80px Lyric`)));[shots,cues]=await Promise.all(['timeline.json','lyrics-full-draft.json'].map(async p=>{const r=await fetch(p);if(!r.ok)throw Error(p);return r.json()}));await Promise.all(['walk-reference','seated-reference','shore-reference'].map(async id=>photos[id]=await image('assets/'+id+'.jpeg')));await window.render(0);window.READY=true})().catch(e=>{console.error(e);throw e});
</script></body></html>
