<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>html,body{padding:0;margin:0;width:100%;height:100%;background:#0b1720;overflow:hidden}canvas{display:block;width:100%;height:100%}</style></head><body><canvas id="scene"></canvas><script>
/* BEACH MEMORIES | cinematic photo motion composition for official Lemo-Opuscar */
/* Copyright for external imagery credited in MEDIA.md. User audio added after export. */
const params=new URLSearchParams(location.search);
const OFFSET=+(params.get('offset')||0);
window.DUR=params.has('preview')?3:133.272;
window.READY=false;
const canvas=document.querySelector('#scene'),cx=canvas.getContext('2d',{alpha:false});
let W=540,H=960,D=1,cues=[],images={};
const ids=['walk','sit','dusk','alone','waves','distant'];
const srcs=Object.fromEntries(ids.map(id=>[id,'assets/'+id+'.jpg']));
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x*x*(3-2*x)};
const fract=x=>x-Math.floor(x);
const random=n=>fract(Math.sin(n*76.234+3.145)*48738.531);
const ink='#121b25',cream='#f9eee0',gold='#f6bf87';
const SHOTS=[
{a:0,b:6.6,id:'waves',name:'Arrival',zoom:1.28,dx:-.04,dy:.06,tint:'cold'},
{a:6.6,b:12,id:'walk',name:'Together',zoom:1.19,dx:.10,dy:-.03,tint:'warm'},
{a:12,b:17.3,id:'sit',name:'A moment',zoom:1.29,dx:-.06,dy:.04,tint:'warm'},
{a:17.3,b:23,id:'waves',name:'Ocean',zoom:1.19,dx:.07,dy:.00,tint:'warm'},
{a:23,b:27.3,id:'distant',name:'Footprints',zoom:1.35,dx:-.1,dy:.03,tint:'warm'},
{a:27.3,b:32.2,id:'walk',name:'Then',zoom:1.22,dx:.08,dy:-.08,tint:'warm'},
{a:32.2,b:36.5,id:'sit',name:'Us',zoom:1.20,dx:-.05,dy:.02,tint:'warm'},
{a:36.5,b:41,id:'dusk',name:'Promise',zoom:1.21,dx:.03,dy:-.04,tint:'warm'},
{a:41,b:46,id:'distant',name:'Nowhere',zoom:1.34,dx:.08,dy:.02,tint:'warm'},
{a:46,b:51.7,id:'walk',name:'Distance',zoom:1.30,dx:-.08,dy:-.08,tint:'warm'},
{a:51.7,b:57.4,id:'dusk',name:'Woh lamhe',zoom:1.25,dx:.04,dy:-.02,tint:'warm',chorus:true},
{a:57.4,b:63.9,id:'sit',name:'Woh baatein',zoom:1.25,dx:-.06,dy:.03,tint:'warm',chorus:true},
{a:63.9,b:70.6,id:'walk',name:'Koi na jaane',zoom:1.40,dx:.11,dy:-.08,tint:'warm',chorus:true},
{a:70.6,b:73.4,id:'waves',name:'Break',zoom:1.20,dx:-.09,dy:.02,tint:'cold'},
{a:73.4,b:78,id:'alone',name:'Alone',zoom:1.22,dx:.08,dy:.03,tint:'cold'},
{a:78,b:82.7,id:'waves',name:'After',zoom:1.32,dx:-.10,dy:-.03,tint:'cold'},
{a:82.7,b:87.5,id:'alone',name:'Gone',zoom:1.37,dx:-.05,dy:.02,tint:'cold'},
{a:87.5,b:92.7,id:'dusk',name:'Remember',zoom:1.39,dx:.05,dy:-.02,tint:'cold'},
{a:92.7,b:98.4,id:'alone',name:'Silence',zoom:1.28,dx:.06,dy:-.09,tint:'cold'},
{a:98.4,b:102.9,id:'waves',name:'Break 1',zoom:1.3,dx:.03,dy:-.04,tint:'cold'},
{a:102.9,b:107.4,id:'walk',name:'Flashback 1',zoom:1.46,dx:-.12,dy:.00,tint:'warm'},
{a:107.4,b:111.8,id:'waves',name:'Break 2',zoom:1.29,dx:-.10,dy:.04,tint:'cold'},
{a:111.8,b:115.7,id:'sit',name:'Flashback 2',zoom:1.43,dx:.07,dy:-.02,tint:'warm'},
{a:115.7,b:119.8,id:'distant',name:'Fade',zoom:1.26,dx:-.07,dy:-.01,tint:'cold'},
{a:119.8,b:124.9,id:'walk',name:'Reprise',zoom:1.38,dx:.07,dy:.0,tint:'warm',chorus:true},
{a:124.9,b:130.0,id:'dusk',name:'Fading',zoom:1.40,dx:-.1,dy:.02,tint:'cold',chorus:true},
{a:130,b:133.272,id:'waves',name:'Only the sea',zoom:1.19,dx:.08,dy:.0,tint:'cold'}
];
function setSize(){
const w=innerWidth||540,h=innerHeight||960,d=Math.max(1,devicePixelRatio||1);
if(W!==w||H!==h||D!==d||!canvas.width){W=w;H=h;D=d;canvas.width=Math.round(w*d);canvas.height=Math.round(h*d)}
cx.setTransform(D,0,0,D,0,0);
}
function paintPhoto(img,time,s,alpha=1,extra=0){
if(!img||!img.complete||!img.naturalWidth){cx.fillStyle='#1c3037';cx.fillRect(0,0,W,H);return}
const p=clamp((time-s.a)/(s.b-s.a));
const minS=Math.max(W/img.naturalWidth,H/img.naturalHeight);
const scale=minS*(s.zoom+(.095+extra)*p);
const sw=img.naturalWidth*scale,sh=img.naturalHeight*scale;
const panX=W*.5-sw*.5 + ((s.dx||0)*(p-.5))*W;
const panY=H*.5-sh*.5 + ((s.dy||0)*(p-.5))*H;
cx.save();cx.globalAlpha=alpha;cx.drawImage(img,panX,panY,sw,sh);cx.restore()
}
function linear(a,b,x){return a+(b-a)*x}
function letter(text,x,y,size,color,align='center',weight=800){cx.font=weight+' '+Math.round(size)+'px Arial,sans-serif';cx.fillStyle=color;cx.textAlign=align;cx.textBaseline='middle';cx.fillText(text,x,y)}
function grade(t,shot){
cx.fillStyle=shot.tint==='cold'?'rgba(5,25,46,.35)':'rgba(66,29,24,.085)';
cx.fillRect(0,0,W,H);
const v=cx.createLinearGradient(0,0,0,H);
v.addColorStop(0,'rgba(7,13,18,.32)');v.addColorStop(.38,'rgba(0,0,0,0)');v.addColorStop(.67,'rgba(8,13,17,.13)');v.addColorStop(1,'rgba(6,11,17,.90)');
cx.fillStyle=v;cx.fillRect(0,0,W,H);
}
function trails(t,shot){
const p=(t-shot.a)/(shot.b-shot.a),last=shot.id==='waves'||shot.chorus;
if(!last)return;
cx.save();cx.strokeStyle='rgba(252,237,211,'+(shot.chorus?.14:.15)+')';cx.lineWidth=1.2;
for(let i=0;i<4;i++){let y=H*(.65+i*.018)+Math.sin(t*1.8+i)*7;cx.beginPath();
for(let x=W*.07;x<W*.93;x+=5){let yy=y+Math.sin((x/W)*Math.PI*4+t*1.7+i*2.1)*4.5;if(x===W*.07)cx.moveTo(x,yy);else cx.lineTo(x,yy)}
cx.stroke()}cx.restore();
}
function crossfade(t,idx,shot){
const fadeDuration=1.05;
paintPhoto(images[shot.id],t,shot);
const p=(t-shot.a);
if(idx>0 && p<fadeDuration){
const prev=SHOTS[idx-1];
paintPhoto(images[prev.id],t,prev,1-ease(p/fadeDuration));
}
}
function flare(t,shot){
const alpha=(shot.chorus?.28:.16)*(0.5+0.5*Math.sin(t*1.72));
const x=W*(.52+.36*Math.sin(t*.07));
const g=cx.createRadialGradient(x,H*.26,0,x,H*.26,W*.68);
g.addColorStop(0,'rgba(255,194,136,'+alpha+')');g.addColorStop(1,'rgba(255,178,135,0)');
cx.fillStyle=g;cx.fillRect(0,0,W,H);
}
function lyrics(t,shot){
const q=cues.find(x=>t>=x.start&&t<x.end&&x.text);
if(!q)return;
const p=(t-q.start)/(q.end-q.start);
const inA=ease((t-q.start)/.30),outA=ease((q.end-t)/.27);
const opacity=inA*outA;
const chorus=!!shot.chorus;
const maxLen=chorus?22:29;
const arr=q.text.split(/\s+/),lines=[];let l='';
for(const w of arr){if((l+' '+w).length>maxLen&&l){lines.push(l);l=w}else l+=(l?' ':'')+w}if(l)lines.push(l);
const max= Math.max(...lines.map(x=>x.length));
const size=Math.min(W*(chorus?.098:.076),W*.82/(max*.54));
const y=H*(chorus?.77:.80);
cx.save();cx.globalAlpha=opacity;cx.translate(0,(1-inA)*H*.017);
const center=y-(lines.length-1)*size*.69;
for(let i=0;i<lines.length;i++){
const full=lines[i].toUpperCase();
cx.font='800 '+Math.round(size)+'px Arial,sans-serif';cx.textAlign='center';cx.textBaseline='middle';
cx.shadowColor='#000';cx.shadowBlur=15;cx.fillStyle='#fff4e5';
cx.fillText(full,W*.5,center+i*size*1.30);
cx.shadowBlur=0;
}
cx.globalAlpha*=.9;cx.fillStyle='#f8c58f';cx.fillRect(W*.41,y+(lines.length*.7+.1)*size,W*.18,Math.max(2,H*.003));
cx.restore();
}
function montage(t,shot){
if(!(t>=98.4&&t<119.8))return;
const hit=Math.pow(.5+.5*Math.cos(t*8.2),4);
cx.save();cx.globalAlpha=hit*.10;cx.fillStyle='#f4b787';cx.fillRect(0,0,W,H);cx.restore();
for(let j=0;j<7;j++){
const x=W*(.08+j*.14),h=H*.025+H*.028*Math.abs(Math.sin(t*(1.9+j*.17)+j));
cx.fillStyle='rgba(249,218,182,.4)';cx.fillRect(x,H*.88-h,W*.008,h)
}
}
function grain(t){
for(let i=0;i<155;i++){let x=random(i*3.151+Math.floor(t*8)*.17)*W;
let y=random(i*2.715+Math.floor(t*8)*.34)*H;
cx.fillStyle='rgba(250,244,225,.04)';cx.fillRect(x,y,1.5,1.5)}
}
function render(t){
const time=t+OFFSET;setSize();
const idx=Math.max(0,SHOTS.findIndex(s=>time>=s.a&&time<s.b));
const shot=SHOTS[idx];cx.fillStyle='#10202c';cx.fillRect(0,0,W,H);
crossfade(time,idx,shot);grade(time,shot);flare(time,shot);trails(time,shot);montage(time,shot);
cx.save();cx.globalAlpha=.84;letter('W O H   L A M H E',W*.075,H*.07,W*.032,cream,'left',700);
cx.globalAlpha=.62;letter('MEMORIES STAY',W*.93,H*.07,W*.026,cream,'right',500);
cx.restore();
lyrics(time,shot);
cx.fillStyle='rgba(245,237,218,.32)';cx.fillRect(W*.075,H*.94,W*.85,1.3);
cx.fillStyle=gold;cx.fillRect(W*.075,H*.94,W*.85*clamp(time/133.272),2.5);
grain(time);
}
window.render=render;
window.TEXTS=t=>{
const time=t+OFFSET,q=cues.find(x=>time>=x.start&&time<x.end&&x.text);
return q?[{id:String(q.start),text:q.text,x0:W*.075,y0:H*.7,x1:W*.925,y1:H*.91}]:[];
};
Promise.all([
fetch('lyrics.json').then(r=>{if(!r.ok)throw Error('missing lyrics.json');return r.json()}).then(v=>cues=v),
...ids.map(id=>new Promise((resolve,reject)=>{
const image=new Image();image.onload=()=>{images[id]=image;resolve()};image.onerror=()=>reject(Error('missing image '+id));image.src=srcs[id];}))
]).then(()=>{window.READY=true;render(0)}).catch(err=>{document.body.textContent=String(err);console.error(err)});
</script></body></html>
