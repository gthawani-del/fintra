<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
@font-face{font-family:MemorySerif;src:url(assets/fonts/serif.woff2)}
@font-face{font-family:MemorySans;src:url(assets/fonts/sans.woff2)}
@font-face{font-family:MemoryDisplay;src:url(assets/fonts/display.woff2)}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#211d24}canvas{display:block;width:100%;height:100%}
</style></head><body><canvas id="film"></canvas><script>
'use strict';
// Native Lemo scene: every frame is a deterministic function of song time.
const query=new URLSearchParams(location.search);
const OFFSET=Number(query.get('start')||0);
window.DUR=Math.min(Number(query.get('duration')||133.272),133.272-OFFSET);
window.READY=false;
const canvas=document.getElementById('film'),c=canvas.getContext('2d',{alpha:false});
let W=1080,H=1920,photos={},footage=[],cues=[],envelope={rms:[],onsets:[],step:.05};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
const out=v=>1-Math.pow(1-clamp(v),3);
const lerp=(a,b,t)=>a+(b-a)*t;
const hash=n=>{let x=Math.sin(n*127.1+19.32)*43758.5453;return x-Math.floor(x)};
const CREAM='#fff1d9',GOLD='#f2c28b',DARK='#20212b';
// Stills are deliberately treated as memory tableaux, never simulated walking.
const shots=[
 {a:0,b:5,id:'video',mode:'full',z:1.02,end:1.02,transition:'wave'},
 {a:5,b:9.2,id:'walk',mode:'full',z:1.05,end:1.15,x:.53,y:.43,transition:'slats'},
 {a:9.2,b:16.2,id:'sit',mode:'full',z:1.13,end:1.27,x:.51,y:.45,transition:'wave'},
 {a:16.2,b:20.8,id:'shore',mode:'window',z:1,end:1.08,transition:'iris'},
 {a:20.8,b:24.4,id:'walk',mode:'full',z:1.45,end:1.37,x:.55,y:.40,transition:'slats'},
 {a:24.4,b:29.8,id:'sit',mode:'full',z:1.08,end:1.17,x:.53,y:.48,transition:'wave'},
 {a:29.8,b:34.3,id:'walk',mode:'duet',z:1.1,end:1.18,transition:'slats'},
 {a:34.3,b:39.1,id:'shore',mode:'full',z:1.09,end:1.2,x:.53,y:.5,transition:'wave'},
 {a:39.1,b:43.9,id:'sit',mode:'window',z:1.2,end:1.28,cool:true,transition:'slats'},
 {a:43.9,b:48.2,id:'walk',mode:'duet',z:1.1,end:1.2,cool:true,transition:'split'},
 {a:48.2,b:52.6,id:'shore',mode:'full',z:1.22,end:1.11,x:.54,y:.51,cool:true,transition:'wave'},
 {a:52.6,b:57.6,id:'video',mode:'full',z:1.02,end:1.05,transition:'slats'},
 {a:57.6,b:62.3,id:'sit',mode:'full',z:1.22,end:1.34,x:.51,y:.44,transition:'wave'},
 {a:62.3,b:66.9,id:'walk',mode:'full',z:1.13,end:1.23,x:.53,y:.44,transition:'iris'},
 {a:66.9,b:72.0,id:'shore',mode:'window',z:1.04,end:1.1,transition:'slats'},
 {a:72,b:76.5,id:'sit',mode:'full',z:1.4,end:1.28,x:.52,y:.43,transition:'wave'},
 {a:76.5,b:80.7,id:'shore',mode:'reflection',z:1.1,end:1.2,cool:true,transition:'wave'},
 {a:80.7,b:85.1,id:'walk',mode:'duet',z:1.14,end:1.18,cool:true,transition:'split'},
 {a:85.1,b:89.5,id:'sit',mode:'full',z:1.17,end:1.31,x:.51,y:.45,cool:true,transition:'slats'},
 {a:89.5,b:95.0,id:'shore',mode:'window',z:1.04,end:1.14,cool:true,transition:'wave'},
 {a:95,b:100.8,id:'walk',mode:'fracture',z:1.14,end:1.22,cool:true,transition:'split'},
 {a:100.8,b:104.4,id:'sit',mode:'full',z:1.38,end:1.22,x:.52,y:.44,transition:'slats'},
 {a:104.4,b:107.3,id:'walk',mode:'full',z:1.06,end:1.22,x:.54,y:.43,transition:'wave'},
 {a:107.3,b:112.3,id:'video',mode:'full',z:1.03,end:1.08,transition:'iris'},
 {a:112.3,b:115.6,id:'sit',mode:'window',z:1.04,end:1.08,transition:'slats'},
 {a:115.6,b:119.1,id:'shore',mode:'reflection',z:1.12,end:1.18,transition:'wave'},
 {a:119.1,b:123.0,id:'walk',mode:'full',z:1.2,end:1.32,x:.54,y:.44,transition:'slats'},
 {a:123,b:127.5,id:'sit',mode:'full',z:1.26,end:1.16,x:.51,y:.45,transition:'wave'},
 {a:127.5,b:133.272,id:'shore',mode:'full',z:1.13,end:1.01,x:.53,y:.51,transition:'wave'}
];
function size(){if(canvas.width!==innerWidth||canvas.height!==innerHeight){W=canvas.width=innerWidth;H=canvas.height=innerHeight}}
function cover(img,rect,z=1,fx=.5,fy=.5){
 const [x,y,w,h]=rect;const iw=img.naturalWidth,ih=img.naturalHeight;
 const scale=Math.max(w/iw,h/ih)*z,sw=iw*scale,sh=ih*scale;
 const dx=x-clamp(fx)*(sw-w),dy=y-clamp(fy)*(sh-h);
 c.drawImage(img,dx,dy,sw,sh);
}
function clippedPhoto(img,rect,z,x=.5,y=.5){c.save();c.beginPath();c.rect(...rect);c.clip();cover(img,rect,z,x,y);c.restore()}
function shade(alpha=.35){const g=c.createLinearGradient(0,0,0,H*.5);g.addColorStop(0,`rgba(25,22,31,${alpha})`);g.addColorStop(.75,'rgba(25,22,31,.04)');g.addColorStop(1,'rgba(25,22,31,0)');c.fillStyle=g;c.fillRect(0,0,W,H)}
function photoFor(s,t){return s.id==='video'?footage[Math.min(119,Math.max(0,Math.floor((t-s.a)*24)))]:photos[s.id]}
function drawShot(s,t){
 const p=smooth((t-s.a)/(s.b-s.a)),z=lerp(s.z,s.end,p);let img=photoFor(s,t);
 c.fillStyle=s.cool?'#242a35':'#e8d7bb';c.fillRect(0,0,W,H);
 if(s.mode==='full'||s.mode==='reflection'){
  cover(img,[0,0,W,H],z,(s.x||.5)+.035*Math.sin(p*2-1),s.y||.5);
  if(s.mode==='reflection'){
   c.save();c.beginPath();c.rect(0,H*.70,W,H*.3);c.clip();
   for(let y=H*.70;y<H;y+=8){const shift=Math.sin(y*.03-t*1.7)*W*.006;c.drawImage(canvas,0,y,W,8,shift,y,W,8)}c.restore();
  }
 }else if(s.mode==='window'){
  // The full image remains identifiable while a second memory window travels across it.
  c.save();c.globalAlpha=.26;cover(img,[0,0,W,H],1.3,.5,.5);c.restore();
  const rect=[W*(.075+.022*Math.sin(p*2)),H*.27,W*.85,H*.60];
  c.save();c.translate(W*.5,H*.57);c.rotate((p-.5)*.025);c.translate(-W*.5,-H*.57);
  c.shadowColor='rgba(40,24,20,.28)';c.shadowBlur=W*.04;c.shadowOffsetY=H*.012;
  c.fillStyle=CREAM;c.fillRect(rect[0]-W*.014,rect[1]-W*.014,rect[2]+W*.028,rect[3]+W*.028);c.shadowBlur=0;c.shadowOffsetY=0;
  clippedPhoto(img,rect,z,.5,.48);c.restore();
 }else if(s.mode==='duet'){
  const gap=W*(.013+.018*Math.sin(p*Math.PI));
  clippedPhoto(img,[0,0,W*.5-gap,H],1.3,.30,.45);
  clippedPhoto(img,[W*.5+gap,0,W*.5-gap,H],1.3,.96,.46);
  c.fillStyle=s.cool?'#263541':'#f4dec0';c.fillRect(W*.5-gap,0,gap*2,H);
 }else if(s.mode==='fracture'){
  for(let i=0;i<3;i++){
   const x=i*W/3,gap=W*.012;
   c.save();c.beginPath();c.rect(x+gap,0,W/3-gap*2,H);c.clip();
   c.translate(Math.sin(t*.7+i)*W*.014,(i-1)*H*.024*Math.sin(p*Math.PI));
   cover(img,[0,0,W,H],z,.51,.46);c.restore();
  }
 }
 if(s.cool){c.fillStyle='rgba(31,62,88,.16)';c.fillRect(0,0,W,H)}
 shade(s.mode==='window'?.08:.40);
 // Light leak is subtle and confined to the edges, preserving faces and fabric.
 const g=c.createRadialGradient(-W*.15,H*.68,0,-W*.15,H*.68,W*.85);
 g.addColorStop(0,`rgba(248,181,104,${s.cool?.035:.09})`);g.addColorStop(1,'rgba(248,181,104,0)');c.fillStyle=g;c.fillRect(0,0,W,H);
}
function wipe(s,t,k){
 const p=out((t-s.a)/.7);c.save();c.beginPath();
 if(s.transition==='wave'){
  const y=H*(1-p);c.moveTo(0,H);c.lineTo(0,y);
  for(let x=0;x<=W+10;x+=15)c.lineTo(x,y+Math.sin(x/W*4.2+t*1.6)*H*.018*Math.sin(p*Math.PI));
  c.lineTo(W,H);c.closePath();
 }else if(s.transition==='iris'){
  c.ellipse(W*.5,H*.48,W*.85*p,H*.85*p,0,0,Math.PI*2);
 }else if(s.transition==='split'){
  c.rect(0,0,W*.5*p,H);c.rect(W-W*.5*p,0,W*.5*p,H);
 }else{
  for(let j=0;j<6;j++){const q=out(clamp((t-s.a-j*.025)/.5));c.rect(j*W/6,0,W/6+1,H*q)}
 }
 c.clip();drawShot(s,t);c.restore();
}
function measure(text,font,size,spacing=0){c.font=`${size}px ${font}`;c.letterSpacing=`${spacing}px`;return c.measureText(text).width}
function title(t){
 if(t<.15||t>4.65)return;
 const enter=out((t-.15)/1),exit=smooth((4.65-t)/.45);
 c.save();c.globalAlpha=enter*exit;c.fillStyle=CREAM;c.textAlign='center';c.textBaseline='alphabetic';
 c.font=`${W*.14}px MemorySerif`;c.letterSpacing=`${W*.005}px`;
 c.fillText('Woh Lamhe',W*.5,H*(.18+(1-enter)*.018));
 c.strokeStyle='rgba(255,241,217,.6)';c.lineWidth=Math.max(1,W*.0012);c.beginPath();c.moveTo(W*(.5-.16*enter),H*.215);c.lineTo(W*(.5+.16*enter),H*.215);c.stroke();c.restore();
}
function type(q,t,shot){
 const age=t-q.start,remaining=q.end-t;if(age<0||remaining<0)return;
 const alpha=smooth(remaining/.25),hero=q.style==='hero';
 const paper=shot.mode==='window',normalInk=paper?DARK:CREAM,activeInk=paper?'#8d4534':GOLD;
 c.save();c.globalAlpha=alpha;c.textAlign='left';c.textBaseline='alphabetic';c.fillStyle=CREAM;
 if(hero){
  const lines=q.lines||q.text.toUpperCase().split(' '),font='MemoryDisplay';
  const max=Math.max(...lines.map(s=>measure(s,font,100)));
  const fs=Math.min(W*.27,W*.85/max*100,H*.25/(lines.length*.94)),lineH=fs*.94;
  const base=H*.105+fs*.82;
  for(let i=0;i<lines.length;i++){
   const wordStart=q.words?.[i]?.start??q.start;
   const e=out((t-wordStart)/.28);if(e===0)continue;
   const y=base+i*lineH;
   c.save();c.beginPath();c.rect(W*.06,y-fs*1.05,W*.88,fs*1.18);c.clip();
   c.font=`${fs}px ${font}`;c.letterSpacing=`${lerp(W*.014,W*.001,e)}px`;
   c.translate(W*.075,y+(1-e)*fs*.8);c.scale(1,lerp(.7,1,e));
   c.fillStyle=i%2?activeInk:normalInk;c.fillText(lines[i],0,0);c.restore();
  }
 }else{
  const words=q.words,baseSize=W*(q.style==='serif'?.079:.066),font=q.style==='serif'?'MemorySerif':'MemorySans';
  const maxWidth=W*.84,space=baseSize*.28;let rows=[[]],used=0;
  for(let i=0;i<words.length;i++){
   const w=words[i],width=measure(w.word,font,baseSize,.2);
   if(used+width>maxWidth&&rows.at(-1).length){rows.push([]);used=0}
   rows.at(-1).push({...w,width,index:i});used+=width+space;
  }
  const fs=rows.length>3?baseSize*.87:baseSize,lineH=fs*1.22;
  const y0=H*(shot.mode==='window'?.15:.16);
  rows.forEach((row,ri)=>{
   let x=W*.08;
   for(const w of row){
    const e=out((t-w.start)/.22),width=measure(w.word,font,fs,.2);
    if(e>0){
     const y=y0+ri*lineH+fs;
     c.save();c.beginPath();c.rect(x-W*.01,y-fs*1.1,width+W*.02,fs*1.27);c.clip();
     c.translate(x,y+(1-e)*fs*.9);if(q.style==='split')c.translate((w.index%2?1:-1)*(1-e)*W*.035,0);
     c.font=`${fs}px ${font}`;c.letterSpacing='.2px';c.fillStyle=t<w.end+.12?activeInk:normalInk;c.fillText(w.word,0,0);c.restore();
    }x+=width+space;
   }
  });
 }
 c.restore();
}
function atmosphere(t,shot){
 const idx=Math.floor(t/envelope.step),energy=envelope.rms[idx]||0,onset=envelope.onsets[idx]||0;
 // A restrained moving shoreline motif during instrumental passages.
 if(!cues.some(q=>t>=q.start&&t<q.end)&&t>16&&t<119){
  c.save();c.strokeStyle=shot.cool?'rgba(214,231,234,.20)':'rgba(255,234,199,.26)';c.lineWidth=W*.001;
  for(let j=0;j<2;j++){c.beginPath();for(let x=0;x<W;x+=12){const y=H*(.86+j*.013)+Math.sin(x/W*5+t*.7+j)*H*(.005+energy*.004);if(x===0)c.moveTo(x,y);else c.lineTo(x,y)}c.stroke()}c.restore();
 }
 // The flashback guitar passage gets quick, small optical accents driven by measured audio.
 if(t>101&&t<119&&onset>.12){c.fillStyle=`rgba(255,228,191,${Math.min(.09,onset*.15)})`;c.fillRect(0,0,W,H)}
}
window.render=function(localT){
 const t=clamp(localT+OFFSET,0,133.271);size();
 const i=Math.max(0,shots.findIndex(s=>t>=s.a&&t<s.b)),s=shots[i];
 if(i>0&&t-s.a<.7){drawShot(shots[i-1],Math.min(t,shots[i-1].b-.001));wipe(s,t,i)}else drawShot(s,t);
 atmosphere(t,s);title(t);
 for(const q of cues)if(t>=q.start&&t<q.end)type(q,t,s);
 if(t>131.9){c.fillStyle=`rgba(25,22,29,${smooth((t-131.9)/1.372)*.94})`;c.fillRect(0,0,W,H)}
};
async function loadImage(src){const img=new Image();img.src=src;await img.decode();if(!img.naturalWidth)throw Error('Invalid image: '+src);return img}
(async()=>{
 await Promise.all([document.fonts.load('40px MemorySerif'),document.fonts.load('40px MemorySans'),document.fonts.load('40px MemoryDisplay')]);
 const ids={walk:'walk-reference',sit:'seated-reference',shore:'shore-reference'};
 await Promise.all(Object.entries(ids).map(async([key,value])=>photos[key]=await loadImage('assets/'+value+'.jpeg')));
 footage=await Promise.all(Array.from({length:120},(_,i)=>loadImage('assets/frames/'+String(i).padStart(4,'0')+'.jpg')));
 const [a,b]=await Promise.all([fetch('lyric-highlights.json'),fetch('audio-motion.json')]);
 if(!a.ok||!b.ok)throw Error('Missing timeline data');cues=await a.json();envelope=await b.json();
 window.READY=true;window.render(0);
})().catch(e=>{console.error(e);throw e});
</script></body></html>
